    <script>
  const canvas = document.getElementById("white-dots");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const dots = [];

for (let i = 0; i < 80; i++) {
  dots.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 6 + 3,
    speed: Math.random() * 0.5 + 0.2,
    glow: Math.random() * 10 + 10,
    rotation: Math.random() * Math.PI * 2
  });
}

function drawStar(x, y, size, rotation) {
  const points = 4;
  const outerRadius = size;
  const innerRadius = size * 0.4;

  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI) / points + rotation;
    const radius = i % 2 === 0 ? outerRadius : innerRadius;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  dots.forEach(dot => {
    drawStar(dot.x, dot.y, dot.size, dot.rotation);

    const gradient = ctx.createRadialGradient(
      dot.x, dot.y, 0,
      dot.x, dot.y, dot.glow
    );
    gradient.addColorStop(0, "rgba(255, 215, 215, 1)");
    gradient.addColorStop(1, "rgba(255, 215, 215, 0)");

    ctx.fillStyle = gradient;
    ctx.fill();

    dot.y += dot.speed;
    dot.rotation += 0.01; // slowly spin each star

    if (dot.y > canvas.height) {
      dot.y = -10;
      dot.x = Math.random() * canvas.width;
    }
  });

  requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
